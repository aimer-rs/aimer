[package]
name = "aimer_prendre"
version = "0.1.0"
edition = "2024"

[features]
# Both are on for `cargo test -p aimer_prendre`. The workspace entry turns the
# defaults off, so a dependent names exactly the side it is: an app that accepts
# input says `host`, a tool that sends it says `client`.
default = ["client", "host"]
# `Client`: connects to a running app and sends it commands.
client = []
# `Server` and `Command::deliver`: lets this process accept commands. Only a
# debug or test build of an app should enable it.
host = ["dep:aimer_attribute", "dep:aimer_capture", "dep:aimer_events", "dep:aimer_platform", "dep:aimer_utils"]

[dependencies]
aimer_attribute = { workspace = true, optional = true }
aimer_capture = { workspace = true, optional = true }
aimer_events = { workspace = true, optional = true }
aimer_platform = { workspace = true, optional = true }
aimer_utils = { workspace = true, optional = true }

[dev-dependencies]
# Decodes the pictures the tests receive.
image = { workspace = true, features = ["png", "jpeg"] }
