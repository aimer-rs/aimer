[package]
name = "aimer_platform"
version = "0.1.0"
edition = "2024"

[features]
# These only select code; the dependencies they need are target-gated below.
native = []
wgpu = []

[dependencies]
aimer_tls.workspace = true
aimer_accessibility.workspace = true
aimer_attribute.workspace = true
aimer_events.workspace = true
aimer_utils.workspace = true
aimer_venus.workspace = true
aimer_widget.workspace = true
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
objc.workspace = true
raw-window-handle.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlElement", "Node", "HtmlCanvasElement", "Element", "Event", "EventTarget", "CssStyleDeclaration"] }
