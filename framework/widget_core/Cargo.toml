[package]
name = "aimer_widget_core"
version = "0.1.0"
edition = "2024"
resolver = "3"

[features]
portable-guest = ["aimer_element/portable-guest", "aimer_portable/portable-guest"]
# Keep the allocation-free draw traversal counter available to release
# acceptance probes without paying for it in ordinary release applications.
frame-stats = ["aimer_element/frame-stats"]

[dependencies]
aimer_element.workspace = true
aimer_portable.workspace = true
aimer_tls.workspace = true
aimer_accessibility.workspace = true
aimer_anteros = { path = "../../host/anteros", default-features = false }
aimer_color.workspace = true
aimer_attribute.workspace = true
aimer_macro.workspace = true
aimer_rubick.workspace = true
aimer_utils.workspace = true
aimer_venus.workspace = true
aimer_events.workspace = true
aimer_focus.workspace = true
aimer_canvas.workspace = true
aimer_cupid.workspace = true
#####################
winit.workspace = true
smallvec.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = {workspace = true, features = ["rt-multi-thread", "macros"]}

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "freebsd", target_os = "openbsd", target_os = "illumos"))'.dependencies]
linkme.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aimer_portable_guest)"] }
