[package]
name = "aimer_quiver"
version = "0.1.0"
edition = "2024"
resolver = "3"


[features]
default = ["native", "web"]
# Enables the optional native API dependencies. Target cfgs choose which
# backend is compiled and selected; Linux/Android also compile OpenGL fallback.
native = [
    "aimer_render/native",
    "aimer_platform/native",
    "aimer_cupid/native",
]
# Present native frames through Cupid's WGPU surface renderer.
wgpu = ["aimer_render/wgpu", "aimer_platform/wgpu", "dep:wgpu", "aimer_cupid/wgpu", "aimer_cupid/apple-core-text"]
# Enables the browser API bindings; target cfgs select WebGPU then WebGL2 fallback.
web = ["aimer_render/web", "aimer_cupid/web"]
# Compatibility alias. Native rendering is threaded by default; select
# RenderMode::Inline at runtime to keep GPU work on the UI thread.
raster-thread = []
# Measure build / encode / present per frame. When this is off, all builds
# compile the timing and content instrumentation out.
frame-stats = ["aimer_render/frame-stats", "aimer_frame_stats/frame-stats", "aimer_widget/frame-stats", "aimer_cupid/frame-stats"]
# Enable the guest-side reflected lowering for integration tests that build an
# AWIR document and feed it through the native hot-reload materializer.
portable-guest = [
    "aimer_hot_reload?/portable-guest",
    "aimer_widget/portable-guest",
    "aimer_provider/portable-guest",
    "aimer_container/portable-guest",
    "aimer_flex/portable-guest",
    "aimer_grid/portable-guest",
    "aimer_scroll/portable-guest",
    "aimer_space/portable-guest",
    "aimer_text/portable-guest",
]
# Enable the interpreted runtime and authenticated app-side reload listener.
# This feature is selected only by `aimer +nightly run -Z hot-reload` host
# builds; ordinary native debug and release applications keep it disabled.
wasm-hot-reload = [
    "dep:aimer_hot_reload",
    "dep:aimer_reload_protocol",
    "dep:aimer_reload_server",
    "dep:aimer_anteros",
    "dep:aimer_container",
    "dep:aimer_flex",
    "dep:aimer_grid",
    "dep:aimer_input",
    "dep:aimer_scroll",
    "dep:aimer_space",
    "dep:aimer_text",
    "aimer_anteros/wasm-hot-reload",
]

[dependencies]
aimer_tls.workspace = true

crossbeam.workspace = true
aimer_animation.workspace = true
aimer_widget.workspace = true
aimer_provider.workspace = true
aimer_style.workspace = true
aimer_attribute.workspace = true
aimer_utils = {workspace = true, features = []}
aimer_frame_stats.workspace = true
aimer_platform.workspace = true
aimer_screen.workspace = true
aimer_render.workspace = true
aimer_window.workspace = true
aimer_hot_reload = { workspace = true, optional = true }
aimer_events.workspace = true
aimer_canvas.workspace = true
aimer_modal.workspace = true
aimer_venus.workspace = true
aimer_rubick.workspace = true
aimer_native.workspace = true
aimer_reload_protocol = { workspace = true, optional = true }
aimer_reload_server = { workspace = true, optional = true }
aimer_anteros = { workspace = true, optional = true }
aimer_container = { workspace = true, optional = true }
aimer_flex = { workspace = true, optional = true }
aimer_grid = { workspace = true, optional = true }
aimer_input = { workspace = true, optional = true }
aimer_scroll = { workspace = true, optional = true }
aimer_space = { workspace = true, optional = true }
aimer_text = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

#################


winit = {workspace = true}
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = {workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"]}
aimer_cupid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies.aimer_cupid]
workspace = true

[target.'cfg(target_os = "android")'.dependencies]
aimer_storage.workspace = true
jni.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlElement", "Node", "HtmlCanvasElement", "Element", "Event", "EventTarget", "CssStyleDeclaration", "WebSocket", "MessageEvent", "ErrorEvent"] }

[dev-dependencies]
aimer_render = { workspace = true, features = ["test-support"] }
aimer_assets.workspace = true
aimer_collapsible.workspace = true
aimer_decoration.workspace = true
aimer_svg.workspace = true
aimer_text.workspace = true
aimer_space.workspace = true
aimer_macro.workspace = true
aimer_container.workspace = true
aimer_flex.workspace = true
aimer_scroll.workspace = true
aimer_input.workspace = true
aimer_ctxmenu.workspace = true
