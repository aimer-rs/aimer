[package]
name = "aimer_widget"
version = "0.1.0"
edition = "2024"
resolver = "3"

[features]
# Keep the allocation-free draw traversal counter available to release
# acceptance probes without paying for it in ordinary release applications.
frame-stats = ["aimer_element/frame-stats", "aimer_widget_core/frame-stats"]

[dependencies]
aimer_element.workspace = true
aimer_widget_core.workspace = true
aimer_async_builder.workspace = true
aimer_focusable.workspace = true

[dev-dependencies]
aimer_venus.workspace = true
aimer_attribute.workspace = true
aimer_utils.workspace = true
aimer_tls.workspace = true
aimer_canvas.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = {workspace = true, features = ["rt-multi-thread", "macros"]}

