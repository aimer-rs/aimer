[package]
name = "aimer_native"
version = "0.1.0"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aimer_portable_guest)"] }

[dependencies]
aimer_anteros.workspace = true
aimer_haptics.workspace = true
winit.workspace = true


[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true
objc2-ui-kit = { workspace = true, features = ["UIFeedbackGenerator", "UIPasteboard"] }
objc2-foundation = "0.3.2"
objc2-core-haptics = "0.3.2"
[target.'cfg(not(target_os = "ios"))'.dependencies]

[target.'cfg(not(target_os = "android"))'.dependencies]

[target.'cfg(not(target_os = "window"))'.dependencies]


[target.'cfg(any(target_os = "macos"))'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSButton",
    "NSControl",
    # `NSView` and `NSWindow` are only defined when `NSResponder` is enabled.
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = "0.3.2"
raw-window-handle.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
arboard.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = [
    "Document", "Element", "HtmlElement", "HtmlInputElement",
    "HtmlTextAreaElement", "HtmlDocument", "Node",
    "CssStyleDeclaration", "Window", "CssRule", "Navigator", "Clipboard"
] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
