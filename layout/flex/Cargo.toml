[package]
name = "aimer_flex"
version = "0.1.0"
edition = "2024"

[features]
portable-guest = [
    "dep:aimer_anteros",
    "aimer_style/portable-guest",
    "aimer_widget/portable-guest",
]
# Keeps the release benchmark able to compare the optimized kernel with the
# compiler-optimized scalar implementation on the same workload.
force-scalar = []

[dependencies]
aimer_anteros = { workspace = true, optional = true }
aimer_attribute.workspace = true
aimer_animation.workspace = true
aimer_cupid.workspace = true
aimer_macro.workspace = true
aimer_style.workspace = true
aimer_utils.workspace = true
aimer_widget.workspace = true

[dev-dependencies]
aimer_canvas.workspace = true
aimer_container.workspace = true
aimer_events.workspace = true
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
