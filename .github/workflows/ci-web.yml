name: aimer CI (web)

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Every library in the workspace has to keep compiling for wasm32, the
      # hot-reload host included: it is native-only in practice, but a crate
      # that stops building for the web takes `--workspace` down with it.
      #
      # Test targets are not part of `--workspace`: most of them use tokio's
      # `net` feature, and mio does not support wasm. Only the browser test
      # targets that scripts/web_tests.sh runs are checked, by name.
      #
      # The target is added inside the repository because rust-toolchain.toml
      # pins a toolchain other than the one the install step above set up, and a
      # target only exists for the toolchain it was added to.
      - name: Check web
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --workspace --target wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown --tests \
            -p aimer_storage -p aimer_persist -p aimer_cupid \
            --features aimer_cupid/web
