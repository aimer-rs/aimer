name: aimer CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    # The macOS entry keeps the name this job has always had, so a branch rule
    # that requires it keeps matching.
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide what the others say.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            job_name: clippy + tests ({aarch64/x86_64}-apple-darwin)
            targets: x86_64-apple-darwin, aarch64-apple-darwin
          - os: ubuntu-latest
            job_name: clippy + tests (x86_64-unknown-linux-gnu)
          # aarch64 Linux runs the tests natively rather than cross-compiling
          # them, so it catches what only an arm64 CPU shows: alignment, SIMD
          # paths, and anything that assumed x86_64.
          - os: ubuntu-24.04-arm
            job_name: clippy + tests (aarch64-unknown-linux-gnu)
          - os: windows-latest
            job_name: clippy + tests (x86_64-pc-windows-msvc)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

        with:
          targets: ${{ matrix.targets }}
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # aimer_vault's platform tests use the machine's real secret store:
      # Keychain on macOS and Credential Manager on Windows are there on a
      # hosted runner, a Secret Service on Linux is not. This starts a session
      # bus with an unlocked default keyring, and exports its address to the
      # steps after it.
      - name: Start a secret store (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring
          export DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          printf '\n' | gnome-keyring-daemon --unlock --components=secrets

      # Cupid's text tests resolve Chinese through the host's fonts, as the
      # macOS runner's PingFang does. The bundled CJK face is Japanese and has
      # no simplified-only ideographs such as 你, and a hosted Ubuntu image
      # carries no face that does, so those characters come out as .notdef.
      - name: Install a CJK font (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          fc-cache -f
          fc-match "sans:lang=zh-cn:charset=4f60"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo check --workspace

      # Every test runs even when one fails, and the failures are printed again
      # at the end so they are not lost in the log. nextest still exits with a
      # failure code if any test failed, which is what fails the job.
      - name: Run tests with nextest
        run: cargo nextest run --workspace --no-fail-fast --failure-output immediate-final
