[package]
name = "jaime"
version = "0.1.0"
edition = "2024"




# No "rlib": with one, cargo also builds the lib for the bin, and Trunk then sees two
# artifacts named `jaime` ("found more than one target artifact").
[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/main.rs"

[[bin]]
name = "jaime"
path = "src/main.rs"

# The relying party for the passkey example:
# `cargo run -p jaime --features passkey-server --bin passkey_server`.
[[bin]]
name = "passkey_server"
path = "src/bin/passkey_server/main.rs"
required-features = ["passkey-server"]

[dependencies]
aimer_time.workspace = true
aimer_tls.workspace = true
aimer = { path = "../..", features = ["markdown", "icons", "svg", "provider", "custom-paint", "effects", "media-io", "platform-services", "passkey", "lottie", "daemon", "live-activity"] }
aimer_widget = { path = "../../framework/widget" }
uuid = { version = "1.22.0", features = ["js", "v4"] }
reqwest.workspace = true
serde_json.workspace = true
# Only the local passkey server verifies signatures; the app stays free of it.
ring = { workspace = true, optional = true }

[dev-dependencies]
aimer_attribute.workspace = true
# The showcase's own tests inspect the renderer's draw commands, which the
# umbrella crate exposes only behind its `cupid` feature.
aimer_cupid.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
default = ["desktop-bin"]
desktop-bin = []
passkey-server = ["dep:ring"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"

