# Generic Dependencies

allocator-api2 = "0.2.21"
dlmalloc = "0.2.14"
libc = "0.2.191"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }
console_error_panic_hook = "0.1.7"
winit = { version = "0.30.12", features = ["android-native-activity"] }
raw-window-handle = "0.6.2"
web-time = "1.1.0"
hashbrown = "0.17.1"
crossbeam = "0.8.4"
tokio = "1.52.3"
once_cell = "1.21.4"
smallvec = { version = "1.13.2", features = ["const_new"] }
url = "2.5.8"
# WebAuthn JSON for `aimer_passkey` on Android, where Credential Manager takes and
# returns JSON. Default features are enough; nothing derives.
serde_json = "1.0.150"
wgpu = { version = "30.0.0", features = ["gles", "webgl", "web"] }
ash = "0.38.0"
ash-window = "0.13.0"
image = { version = "0.25.10", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "http2",
] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
openssl = { version = "0.10.81", features = ["vendored"] }
uuid = { version = "1.23.5", features = ["js", "v4", "serde"] }
dirs = "6.0.0"
webbrowser = "1.2.4"
naga = { version = "30.0.0", features = ["wgsl-in"] }

# Markdown - Optinal Feature

markdown = "1.0.0"
arborium = "2.18.0"
synoptic = "2.2.9"
# Pure Rust regex engine only: `default` pulls in the C `onig` library and themes
# this crate never uses. The bundled syntaxes come from `two-face`, which adds the
# languages syntect's own set lacks (TypeScript, Kotlin, Swift, TOML, ...).
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "yaml-load",
    "regex-fancy",
] }
two-face = { version = "0.5.2", default-features = false, features = [
    "syntect-fancy",
] }


# Macros Dependencies
# f033ef1403b4dbd276d95c26ff05b51d758d7b14 | https://github.com/dtolnay/syn.git
syn = { version = "2.0.118", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.46"
proc-macro-crate = "3.5.0"

# Font Utils

bytemuck = { version = "1.25.1", features = ["derive"] }
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"

# Hot Reload - Experimental Feature

linkme = "0.3.35"
wasmi = { version = "1.1.0", default-features = false, features = ["std"] }
wasmparser = { version = "0.239.0", default-features = false }

# Web Deps

wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = [
    "CanvasRenderingContext2d",
    "Clipboard",
    "DomMatrix",
    "Navigator",
    "TextMetrics",
    "Window",
] }
wasm-bindgen-futures = "0.4.76"
wasm-bindgen-test = "0.3.79"
js-sys = "0.3.103"

# Android Family

jni = "0.22.4"
ndk-context = "0.1.1"

# Apple Family

objc = { version = "0.2.7" }
muda = "0.19.3"
objc2-ui-kit = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-core-text = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
# System passkeys for `aimer_passkey` (AuthenticationServices). Default features
# are off: the crate binds a hundred classes and only a few are used.
objc2-authentication-services = { version = "0.3.2", default-features = false }
# Cupid's native Metal backend. Default features are off because they drag in
# dispatch2 and every MTL4* module; member crates opt into the specific
# MTL* submodules they need, mirroring wgpu-hal's own selection.
objc2-metal = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false }
# Opt-in native Direct3D 12 bindings used by Cupid and Quiver on Windows.
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
] }

colored = "3.1.1"
arboard = "3.6.1"
thiserror = "2.0.18"
toml = "1.1.2+spec-1.1.0"
tempfile = "3.27.0"
sha2 = "0.11.0"
hex = "0.4.3"
ring = "0.17.14"
subtle = "2.6.1"
zeroize = "1.8.2"
# Keychain access for `aimer_vault`. Already in the lockfile through
# rustls-platform-verifier; default features (TLS helpers) are not needed.
security-framework = { version = "3.7.0", default-features = false }
security-framework-sys = { version = "2.17.0", default-features = false }
core-foundation = "0.10.1"
# Secret Service (GNOME Keyring / KWallet) client for `aimer_vault` on Linux. 5.19.0
# is the newest release older than two weeks; 6.0.0 is too fresh to adopt yet.
zbus = "5.19.0"
# macOS defaults dev builds to `unpacked`, which keeps every codegen-unit object
# file beside the binary and leaks a fresh set of 256 per crate on each rebuild.
# Hundreds of thousands of them made the first Core Foundation call of every
# test binary (a scan of its own directory) take 20+ seconds.
[profile.dev]
debug = "line-tables-only"


[profile.dev.package.aimer_rubick]
opt-level = 3

[profile.dev.package.aimer_venus]
opt-level = 3

# syntect parses every highlighted line with a regex engine, and decoding its
# bundled syntaxes runs bincode and inflate over megabytes. Unoptimized they
# cost seconds in a debug build (see the markdown `syntect` feature).
[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.bincode]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3


[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(aimer_portable_guest)'] }
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(aimer_portable_guest)'] }
