[package]
name = "aimer_svg"
version = "0.1.0"
edition = "2024"
description = "Retained SVG parsing and widgets for Aimer"

[features]
portable-guest = ["aimer_widget/portable-guest"]

[dependencies]
aimer_canvas.workspace = true
aimer_cupid.workspace = true
aimer_attribute.workspace = true
aimer_events.workspace = true
aimer_utils.workspace = true
aimer_widget.workspace = true
aimer_venus.workspace = true
crossbeam.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
openssl = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Response", "Window"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
