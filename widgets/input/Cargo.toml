[package]
name = "aimer_input"
version = "0.1.0"
edition = "2024"
resolver = "3"

[features]
portable-guest = [
    "dep:aimer_anteros",
    "aimer_style/portable-guest",
    "aimer_widget/portable-guest",
    "aimer_container/portable-guest",
    "aimer_decoration/portable-guest",
]

[dependencies]
aimer_time.workspace = true
aimer_tls.workspace = true
aimer_anteros = { workspace = true, optional = true }
aimer_widget.workspace = true
aimer_accessibility.workspace = true
aimer_attribute.workspace =  true
aimer_events.workspace = true
aimer_canvas.workspace = true
aimer_cupid.workspace = true
aimer_utils.workspace = true
aimer_venus.workspace = true
aimer_style.workspace = true
aimer_animation.workspace = true
unicode-segmentation.workspace = true
aimer_macro.workspace = true
aimer_text.workspace = true
aimer_native.workspace = true
aimer_container.workspace = true
aimer_decoration.workspace = true
aimer_ctxmenu.workspace = true
#####################
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = {workspace = true, features = ["rt-multi-thread", "macros", "time"]}


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlInputElement", "HtmlElement", "CssStyleDeclaration", "HtmlCollection", "KeyboardEvent", "KeyboardEventInit", "InputEvent", "CompositionEvent", "EventTarget", "Navigator", "Clipboard"] }

[dev-dependencies]
aimer_flex.workspace = true
