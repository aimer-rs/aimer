[package]
name = "aimer_assets"
version = "0.1.0"
edition = "2024"

[features]
bundled-fonts = ["aimer_cupid/bundled-fonts"]
portable-guest = ["aimer_widget/portable-guest"]

[dependencies]
aimer_utils.workspace = true
aimer_canvas.workspace = true
aimer_attribute.workspace = true
aimer_widget.workspace = true
aimer_container.workspace = true
aimer_color.workspace = true
aimer_style.workspace = true
aimer_macro.workspace = true
aimer_cupid.workspace = true
aimer_svg.workspace = true
aimer_venus.workspace = true
crossbeam.workspace = true

######


image = { workspace = true, features = ["default-formats", "rayon"] }
once_cell.workspace = true
winit.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
openssl = { workspace = true }
aimer_events.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [ "Response", "Window", "Blob", "ImageBitmap", "ImageBitmapOptions", "ResizeQuality", "RequestInit", "Headers", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageData" ] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
