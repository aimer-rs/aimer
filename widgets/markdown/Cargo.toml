[package]
name = "aimer_markdown"
version = "0.1.0"
edition = "2024"

[dependencies]
aimer_rubick.workspace = true
aimer_macro.workspace = true
aimer_utils.workspace = true
aimer_widget.workspace = true
aimer_text.workspace = true
aimer_container.workspace = true
aimer_flex.workspace = true
aimer_grid.workspace = true
aimer_scroll.workspace = true
markdown.workspace = true
aimer_assets.workspace = true
aimer_color.workspace = true
aimer_style.workspace = true
webbrowser.workspace = true
aimer_svg.workspace = true
aimer_input.workspace = true
aimer_native.workspace = true
synoptic.workspace = true
syntect = { workspace = true, optional = true }
two-face = { workspace = true, optional = true }
aimer_std.workspace = true
# Only the 35 most common languages are compiled in: every grammar adds a C
# parser to the build and to the binary, and `all-languages` pulls in ~110.
# Aliases such as `py`, `sh`, `yml` and `jsx` resolve to these. Unlisted
# languages render as plain text.
arborium = { workspace = true, features = [
    "lang-rust",
    "lang-python",
    "lang-javascript",
    "lang-typescript",
    "lang-tsx",
    "lang-c",
    "lang-cpp",
    "lang-c-sharp",
    "lang-java",
    "lang-kotlin",
    "lang-swift",
    "lang-go",
    "lang-ruby",
    "lang-php",
    "lang-bash",
    "lang-powershell",
    "lang-lua",
    "lang-sql",
    "lang-html",
    "lang-css",
    "lang-scss",
    "lang-json",
    "lang-yaml",
    "lang-toml",
    "lang-xml",
    "lang-markdown",
    "lang-dockerfile",
    "lang-diff",
    "lang-haskell",
    "lang-scala",
    "lang-dart",
    "lang-zig",
    "lang-elixir",
    "lang-make",
    "lang-glsl",
], optional = true }

[features]
default = []
portable-guest = ["aimer_widget/portable-guest", "aimer_style/portable-guest"]
# Opt into the tree-sitter backed `arborium` highlighter. It understands code
# far better than the default regex based `synoptic` backend, at the cost of
# pulling in a tree-sitter grammar per language and a much heavier build.
arborium = ["dep:arborium"]
# Opt into the `syntect` highlighter. It runs Sublime Text `.sublime-syntax`
# definitions, so applications can register languages the bundled set lacks.
# When both this and `arborium` are enabled, this one wins: it is the only
# backend with a registration API, which must never be silently ignored.
syntect = ["dep:syntect", "dep:two-face"]

[dev-dependencies]
aimer_attribute.workspace = true
aimer_canvas.workspace = true
aimer_cupid.workspace = true
tokio.workspace = true
winit.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aimer_portable_guest)"] }
