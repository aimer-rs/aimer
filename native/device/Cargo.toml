[package]
name = "aimer_device"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aimer_portable_guest)"] }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "linux"))'.dependencies]
libc.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-foundation = { workspace = true, features = ["std", "NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSUUID", "NSObject"] }
objc2-ui-kit = { workspace = true, features = ["std", "UIDevice"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Navigator", "Window"] }
