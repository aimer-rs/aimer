[package]
name = "aimer_cupid"
version = "0.1.0"
edition = "2024"
description = "A rendering engine that optimized for the ui framework"

[features]
default = ["native", "web"]
# Enable the optional native API dependencies. Backend selection is performed
# by target cfgs in backend.rs.
native = [
    "apple-core-text",
    "dep:raw-window-handle",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-quartz-core",
    "dep:objc2-metal",
    "dep:aimer_cupid_metal",
    "dep:aimer_cupid_vulkan",
    "dep:aimer_cupid_opengl",
    "dep:aimer_cupid_dx12",
    "dep:objc2-app-kit",
    "dep:windows",
    "dep:ash",
]
# Keep the WGPU adapter optional so a WGPU-only build can disable default
# features and omit the native API dependency set.
wgpu = ["dep:wgpu", "dep:winit", "dep:aimer_cupid_wgpu"]
frame-stats = ["aimer_cupid_metal?/frame-stats"]
# Keep optional checked-in fallback faces out of native downstream binaries
# unless an application explicitly opts into deterministic bundled rendering.
# wasm always carries the generic Latin/monospace faces because browsers do not
# expose readable system font files to Cupid.
bundled-fonts = ["aimer_cupid_font/bundled-fonts"]
# The production profile owns standard-font parsing, shaping, fallback-aware
# resolution, and rasterization. The optional Apple-private backend is kept
# separate below so the portable path remains available on every platform.
apple-core-text = [
    "aimer_cupid_font/apple-core-text",
    "dep:objc2-core-foundation",
]
# Native Direct3D 12 windowed demo.
dx12-demo = ["native", "dep:winit"]
# Native Vulkan and OpenGL windowed demos.
vulkan-demo = ["native", "dep:winit"]
opengl-demo = ["native", "dep:winit"]
# Browser GPU APIs used by the target-selected WebGPU/WebGL2 backends.
web = ["dep:aimer_cupid_webgl", "dep:aimer_cupid_webgpu"]
# Optional windowed demo for the direct OpenGL backend.
metal-demo = [
    "native",
    "dep:winit",
    "dep:raw-window-handle",
    "dep:objc2-app-kit",
]
[[bin]]
path = "src/bin.rs"
name = "cupid"
required-features = ["wgpu"]

[[bin]]
path = "src/bin_metal.rs"
name = "cupid-metal"
required-features = ["metal-demo"]

[[bin]]
path = "src/bin_dx12.rs"
name = "cupid-dx12"
required-features = ["dx12-demo"]

[[example]]
name = "image_scroll_memory_profile"
required-features = ["wgpu"]

[[example]]
name = "text_decoration_benchmark"
required-features = ["wgpu"]

[[example]]
name = "text_prepare_mixed_benchmark"
required-features = ["wgpu"]

[[example]]
name = "text_resize_benchmark"
required-features = ["wgpu"]

[[example]]
name = "text_scroll_benchmark"
required-features = ["wgpu"]

[[bin]]
path = "src/bin_vulkan.rs"
name = "cupid-vulkan"
required-features = ["vulkan-demo"]

[[bin]]
path = "src/bin_opengl.rs"
name = "cupid-opengl"
required-features = ["opengl-demo"]

[dependencies]
aimer_tls.workspace = true
aimer_utils = { workspace = true, features = ["time-cost"] }
aimer_rubick.workspace = true
aimer_color.workspace = true
aimer_shape.workspace = true
aimer_cupid_svg.workspace = true
aimer_cupid_font.workspace = true
aimer_cupid_gpu.workspace = true
aimer_cupid_vulkan = { workspace = true, optional = true }
aimer_cupid_opengl = { workspace = true, optional = true }
aimer_cupid_dx12 = { workspace = true, optional = true }
aimer_cupid_webgl = { workspace = true, optional = true }
aimer_cupid_webgpu = { workspace = true, optional = true }



#############
wgpu = { workspace = true, optional = true }
aimer_cupid_wgpu = { workspace = true, optional = true }
winit = { version = "0.30.12", default-features = false, optional = true, features = [
    "android-native-activity",
    "rwh_06",
    "wayland",
    "wayland-csd-adwaita-notitle",
    "wayland-dlopen",
    "x11",
] }
raw-window-handle = { workspace = true, optional = true }
bytemuck.workspace = true
unicode-segmentation.workspace = true
# Cupid decodes PNG/JPEG/TIFF font strikes and the example image. Keep the
# image crate's broad default-format and rayon features out of this crate.
image = { workspace = true, default-features = false, features = [
    "jpeg",
    "png",
    "tiff",
] }
hashbrown.workspace = true
smallvec.workspace = true

[dev-dependencies]
aimer_cupid_font = { workspace = true, features = ["test-counters"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
aimer_cupid_metal = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true, features = [
    "std",
    "CFArray",
    "CFCharacterSet",
    "CFData",
    "CFDictionary",
    "CFLocale",
    "CFNumber",
    "CFString",
    "CFURL",
] }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true, features = [
    "std",
    "NSResponder",
    "NSView",
    "objc2-quartz-core",
] }
# NSString for shader source and labels, NSError for the fallible Metal
# constructors, NSRange/NSValue for region and clear-color plumbing.
objc2-foundation = { workspace = true, optional = true, features = [
    "std",
    "NSError",
    "NSObject",
    "NSRange",
    "NSString",
    "NSValue",
] }
objc2-quartz-core = { workspace = true, optional = true, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
] }
# The native Metal backend. Each MTL* feature turns on one generated submodule,
# so the list is exactly the surface `backend/metal.rs` touches. `bitflags` is
# required for the MTLResourceOptions / MTLTextureUsage / MTLUsagePageRange
# newtype operators.
objc2-metal = { workspace = true, optional = true, features = [
    "std",
    "bitflags",
    "block2",
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLArgument",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDepthStencil",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPipeline",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Response",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlRenderbuffer",
    "WebGlSampler",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }


[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
ash = { workspace = true, optional = true }
