[package]
name = "aimer_render"
version = "0.1.0"
edition = "2024"

[features]
default = ["native", "web"]
# Enables the optional native API dependencies. Target cfgs choose which
# backend is compiled and selected; Linux/Android also compile OpenGL fallback.
native = [
    "aimer_platform/native",
    "aimer_cupid/native",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
    "dep:objc2-ui-kit",
    "dep:windows",
]
# Present native frames through Cupid's WGPU surface renderer.
wgpu = ["aimer_platform/wgpu", "dep:windows", "dep:wgpu", "aimer_cupid/wgpu", "aimer_cupid/apple-core-text"]
# Enables the browser API bindings; target cfgs select WebGPU then WebGL2 fallback.
web = ["aimer_cupid/web"]
# Test-only constructors for hosts that script the render worker.
test-support = []
# Measure build / encode / present per frame.
frame-stats = ["aimer_frame_stats/frame-stats", "aimer_cupid/frame-stats"]

[dependencies]
aimer_time.workspace = true
aimer_cupid.workspace = true
aimer_events.workspace = true
aimer_frame_stats.workspace = true
aimer_platform.workspace = true
aimer_utils.workspace = true
aimer_widget.workspace = true
winit.workspace = true
wgpu = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
raw-window-handle.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-app-kit = { workspace = true, optional = true, features = [
    "std",
    "NSResponder",
    "NSView",
    "objc2-quartz-core",
] }
objc2 = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
# CATransaction suppresses implicit Metal sublayer animations; enabled on macOS
# too so the UIKit layer configuration can be regression-tested on the host.
objc2-quartz-core = { workspace = true, optional = true, features = ["CATransaction"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { workspace = true, optional = true, features = ["std", "UIView"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlElement", "Node", "HtmlCanvasElement", "Element", "Event", "EventTarget", "CssStyleDeclaration"] }
