[package]
name = "aimer_webgl"
version = "0.1.0"
edition = "2024"
description = "The browser WebGL2 backend for the Cupid rendering engine"

[lints]
workspace = true

[dependencies]
aimer_cupid_gpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlRenderbuffer",
    "WebGlSampler",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }

# Browser tests: they run in headless Chromium through wasm-bindgen-test.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures.workspace = true
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Event",
    "EventTarget",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "MediaError",
    "Url",
    "Window",
] }
