[package]
name = "aimer_webgpu"
version = "0.1.0"
edition = "2024"
description = "The browser WebGPU backend for the Cupid rendering engine"

[lints]
workspace = true

[dependencies]
aimer_cupid_gpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Gpu",
    "GpuAdapter",
    "GpuAdapterInfo",
    "GpuBindGroup",
    "GpuBindGroupDescriptor",
    "GpuBindGroupLayout",
    "GpuBindGroupLayoutDescriptor",
    "GpuBuffer",
    "GpuBufferDescriptor",
    "GpuCanvasAlphaMode",
    "GpuCanvasConfiguration",
    "GpuCanvasContext",
    "GpuCommandBuffer",
    "GpuCommandEncoder",
    "GpuCommandEncoderDescriptor",
    "GpuDevice",
    "GpuExtent3dDict",
    "GpuIndexFormat",
    "GpuPipelineLayout",
    "GpuPipelineLayoutDescriptor",
    "GpuQueue",
    "GpuRenderPassColorAttachment",
    "GpuRenderPassDescriptor",
    "GpuRenderPassEncoder",
    "GpuRenderPipeline",
    "GpuRenderPipelineDescriptor",
    "GpuSampler",
    "GpuSamplerDescriptor",
    "GpuShaderModule",
    "GpuShaderModuleDescriptor",
    "GpuSupportedLimits",
    "GpuTexelCopyBufferInfo",
    "GpuTexelCopyBufferLayout",
    "GpuTexelCopyTextureInfo",
    "GpuTexture",
    "GpuTextureAspect",
    "GpuTextureDescriptor",
    "GpuTextureFormat",
    "GpuTextureView",
    "HtmlVideoElement",
    "HtmlCanvasElement",
] }

# Browser tests: they run in headless Chromium through wasm-bindgen-test.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Event",
    "EventTarget",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "Url",
    "Window",
] }
