[package]
name = "aimer_effect_pipeline"
version = "0.1.0"
edition = "2024"
description = "Application-defined shader effects for the Cupid rendering engine"

[dependencies]
aimer_cupid_gpu.workspace = true
aimer_pipeline_core.workspace = true
# Translates an effect's `.aimer` source for whichever backend renders it.
aimer_transpiler.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dev-dependencies]
# The Vulkan backend's run-time WGSL compiler, to check effects compile for it.
aimer_vulkan.workspace = true
