[package]
name = "aimer_text_pipeline"
version = "0.1.0"
edition = "2024"
description = "Glyph atlas and text render pipeline for the Cupid rendering engine"

[features]
# Adds the `wgpu` vertex-layout helpers and the tests that read them.
wgpu = ["dep:wgpu", "dep:aimer_wgpu"]

[dependencies]
aimer_cupid_font.workspace = true
aimer_cupid_gpu.workspace = true
aimer_pipeline_core.workspace = true
aimer_primitives.workspace = true
aimer_time.workspace = true
aimer_utils.workspace = true
bytemuck.workspace = true
hashbrown.workspace = true
aimer_wgpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
aimer_cupid_font = { workspace = true, features = ["test-counters"] }
